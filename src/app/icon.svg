<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Background Gradient: Deep Espresso / Dark Chocolate -->
    <linearGradient id="rnBg" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#1E1611"/>
      <stop offset="100%" stop-color="#110D0A"/>
    </linearGradient>

    <!-- Metallic Bronze / Amber Accent Border Gradient -->
    <linearGradient id="rnBorder" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#E5BA8E" stop-opacity="0.9"/>
      <stop offset="35%" stop-color="#D9A574" stop-opacity="0.7"/>
      <stop offset="70%" stop-color="#B97A4C" stop-opacity="0.5"/>
      <stop offset="100%" stop-color="#3A2C1F" stop-opacity="0.8"/>
    </linearGradient>

    <!-- Monogram Gradient: Warm Champagne -> Amber Gold -> Terracotta Bronze -->
    <linearGradient id="rnGold" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#FAF0E6"/>
      <stop offset="25%" stop-color="#F3D5B5"/>
      <stop offset="60%" stop-color="#D9A574"/>
      <stop offset="100%" stop-color="#B97A4C"/>
    </linearGradient>

    <!-- Drop Shadow Filter for Monogram Depth -->
    <filter id="rnShadow" x="-10%" y="-10%" width="130%" height="130%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <!-- Squircle Base (Apple 22% curvature: rx=108 on 464px) -->
  <rect x="24" y="24" width="464" height="464" rx="108" fill="url(#rnBg)" stroke="url(#rnBorder)" stroke-width="6"/>

  <!-- Subtle Inset Glow Rim -->
  <rect x="30" y="30" width="452" height="452" rx="102" fill="none" stroke="#D9A574" stroke-width="1.5" stroke-opacity="0.2"/>

